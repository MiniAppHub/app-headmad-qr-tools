# Публикация QR-Tools: при теге v* — релиз ZIP и обновление ветки gh-pages (сайт).
name: publish
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run check
      - name: Собрать сайт из mapp/public
        run: |
          rm -rf site && cp -r mapp/public site
          test -f site/index.html
      - name: Обновить gh-pages
        run: |
          git config user.name "miniapphub-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch -q origin gh-pages
          git checkout -q --orphan pages-tmp
          git rm -rfq . || true
          cp -r site/. .
          rm -rf site
          git add -A
          git commit -qm "Pages: $GITHUB_SHA"
          git push -f origin pages-tmp:gh-pages
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Упаковка
        run: sudo apt-get install -y -q zip >/dev/null && cd mapp && zip -qr ../headmad.qr-tools-${GITHUB_REF_NAME#v}.zip . && cd ..
      - uses: softprops/action-gh-release@v2
        with:
          files: headmad.qr-tools-*.zip
          generate_release_notes: true
