<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header><h1>QR-Tools</h1><p class="muted">Создать и прочитать QR-код</p></header>

  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="gen" role="tab">Создать</button>
    <button class="tab" data-tab="scan" role="tab">Сканировать</button>
  </div>

  <section id="gen" class="panel">
    <textarea id="text" rows="3" placeholder="Текст или ссылка"></textarea>
    <button id="make" class="btn">Сгенерировать</button>
    <div class="qr-box"><div id="qr"></div></div>
    <button id="save" class="btn ghost" hidden>Сохранить SVG</button>
  </section>

  <section id="scan" class="panel" hidden>
    <p class="muted">Загрузите фото QR-кода. Камера доступна при сборке в оболочке.</p>
    <input id="file" type="file" accept="image/*">
    <pre id="result" class="result" hidden></pre>
  </section>
</main>
<script src="vendor/qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
